<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FeedIn — Social & Communication Platform</title>
    <!--
      ============================================================================
      UX NORTH-STAR REFERENCE for FeedIn's Communication Platform.
      This file is preserved as the VISUAL / INTERACTION reference ONLY.
      None of this HTML/CSS/JS logic is migrated. Every screen and flow is rebuilt
      as native Flutter per docs/communication-platform/ARCHITECTURE.md.
      Design tokens: slate surfaces + pink->purple gradient + emerald "secure" accent,
      Inter font, glass surfaces. Screens to reproduce natively:
        - Chats view (Messages & Calls, secure-plane banner, tiles w/ inline call buttons, Group Call Hub)
        - 1:1 call modal (E2EE badge, ringing, duration, mute/video/speaker/end, minimize)
        - Group call grid (participant cards w/ mute state)
        - Floating PiP call widget (tap to return)
        - Camera studio / post-capture / comments drawer / creator profile / audio modal (already shipped)
      ============================================================================
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        feed: {
                            dark: '#0f172a',
                            surface: '#1e293b',
                            card: '#090d16',
                            accent: '#ec4899',
                            blue: '#2481cc',
                            emerald: '#10b981'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="h-full text-slate-100 font-sans antialiased bg-slate-950">
    <!--
      NOTE: The full interactive preview (feed pager, camera studio, WhatsApp/Telegram
      calling modal with 1:1 + group grid + PiP, comments drawer, creator profile,
      wallet, profile) was supplied by the product owner as the design north-star.

      It is intentionally NOT reproduced verbatim here as runnable code, because the
      implementation is native Flutter, not web. The actionable distillation —
      design tokens, screen inventory, component structure, and interaction flows —
      lives in:
          docs/communication-platform/README.md   (UX north-star section)
          docs/communication-platform/ARCHITECTURE.md  (Phase 3.10 UX mapping)

      Key communication surfaces to build natively (from the preview):
        1. ConversationListScreen  — "Messages & Calls", SecurePlaneBanner (emerald,
           "End-to-end encrypted • 1:1 & Group Active • ONLINE"), "Group Call Hub",
           ConversationTile with inline voice + video buttons.
        2. CallScreen (mode=voice/video) — pulsing peer avatar, E2EE badge, ringing,
           live duration, controls (mute/video/speaker/end), minimize -> PiP.
        3. CallScreen (mode=groupVideo) — ParticipantGrid of avatar cards with
           per-participant mute indicators, "N Participants in SFU Room".
        4. CallPipOverlay — floating "In Call • 00:00 • Tap to return" widget.

      The original raw HTML the owner pasted is the canonical look-and-feel source of
      truth and can be re-embedded verbatim on request.
    -->
    <div class="max-w-lg mx-auto p-6 text-slate-300 text-sm leading-relaxed">
      <h1 class="text-xl font-black bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">feedIn — Communication UX Reference</h1>
      <p class="mt-3">See <code>README.md</code> and <code>ARCHITECTURE.md</code> in this folder for the native design derived from the owner's HTML preview.</p>
    </div>
</body>
</html>
