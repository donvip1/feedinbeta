[versions]
agp = "8.13.0"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.4"
coroutines = "1.10.2"
coreKtx = "1.17.0"
lifecycle = "2.10.0"
activityCompose = "1.12.1"
